name: Build APK

# Builds the installable .apk in the cloud so nothing Android has to live on the
# MacBook. Run it from the Actions tab (Run workflow) or by pushing to main.
#
# Output: an artifact called "rsf-session-logger-apk" on the run's summary page.
# Download it on the tablet, or download it here and copy it across by USB.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Signed release build (needs the keystore secrets)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add the Android platform
        run: |
          npx cap add android || echo "android/ already present"
          npx cap sync android

      - name: Generate launcher icons from resources/icon-1024.png
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#12357e' || \
            echo "Icon generation skipped — check resources/icon-1024.png"

      # The keystore lives in GitHub Secrets, base64-encoded. It is never in the
      # repo. Losing it means no future build can install over the existing app.
      - name: Restore the signing keystore
        if: ${{ github.event.inputs.release != 'false' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See DOCUMENTS/KEYSTORE.md — run the one-time keystore setup before a release build."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/rsf-release.keystore
          echo "Keystore restored ($(wc -c < android/rsf-release.keystore) bytes)"

      - name: Build signed release APK
        if: ${{ github.event.inputs.release != 'false' }}
        env:
          KS_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/rsf-release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug APK
        if: ${{ github.event.inputs.release == 'false' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect the .apk
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rsf-session-logger-apk
          path: out/*.apk
          retention-days: 90

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/rsf-release.keystore
